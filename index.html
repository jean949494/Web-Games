<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10141f" />
  <title>Spiele</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #10141f;
      color: #f4f1ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 28px 16px max(28px, env(safe-area-inset-bottom));
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { font-size: 13px; opacity: 0.6; margin: 0 0 24px; }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #1c2333;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .card:active { background: #232b3e; }
    .card-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .card-desc { font-size: 13px; opacity: 0.7; line-height: 1.4; }
    .emoji { font-size: 26px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Spiele</h1>
    <p class="sub">Testversionen – noch nicht veröffentlicht</p>

    <a class="card" href="games/ninja-wandsprung/">
      <div class="emoji">🥷</div>
      <div class="card-title">Ninja Wandsprung</div>
      <div class="card-desc">Halten lädt den Sprung auf, loslassen springt zur anderen Wand. Möglichst hoch kommen, Stacheln ausweichen.</div>
    </a>
  </div>
</body>
</html>
