<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10141f" />
  <title>Kurve Solo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="340" height="480"></canvas>

    <div id="hud-score" class="hud-score" hidden>0</div>

    <button id="btn-pause" class="icon-btn corner-btn" aria-label="Pause" hidden>⏸</button>

    <div id="screen-menu" class="screen">
      <div class="title">🌀 Kurve Solo</div>
      <button id="btn-start" class="btn-primary" aria-label="Start">▶</button>
      <div class="hint">Linke/rechte Seite halten zum Lenken</div>
      <div id="best-score" class="best-score"></div>
      <button id="btn-sound-menu" class="icon-btn sound-corner" aria-label="Sound an/aus">🔊</button>
    </div>

    <div id="screen-pause" class="screen" hidden>
      <div class="title small">Pause</div>
      <button id="btn-resume" class="btn-primary" aria-label="Weiter">▶</button>
      <div class="row">
        <button id="btn-sound-pause" class="icon-btn" aria-label="Sound an/aus">🔊</button>
        <button id="btn-restart-pause" class="icon-btn" aria-label="Neustart">↻</button>
      </div>
    </div>

    <div id="screen-gameover" class="screen" hidden>
      <div class="title small">Game Over</div>
      <div id="go-score" class="go-score">0</div>
      <div id="go-best" class="go-best"></div>
      <div class="hint">Tippen zum Neustart &amp; Lenken</div>
    </div>
  </div>

  <script src="../../shared/storage.js"></script>
  <script src="../../shared/audio.js"></script>
  <script src="../../shared/analytics.js"></script>
  <script src="../../shared/poki.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/game.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
